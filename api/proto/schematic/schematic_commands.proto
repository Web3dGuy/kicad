syntax = "proto3";

package kiapi.schematic.commands;

import "common/types/base_types.proto";
import "common/types/enums.proto";
import "google/protobuf/any.proto";

// Proof of Concept: Get basic schematic information
message GetSchematicInfo {
    kiapi.common.types.DocumentSpecifier schematic = 1;
}

message SchematicInfoResponse {
    string project_name = 1;
    int32 sheet_count = 2;
    int32 symbol_count = 3;
    int32 net_count = 4;
    repeated string sheet_names = 5;
}

// Get schematic items (wires, junctions, labels)
message GetSchematicItems {
    kiapi.common.types.DocumentSpecifier schematic = 1;
    repeated kiapi.common.types.KIID item_ids = 2;  // Empty = get all
    repeated kiapi.common.types.KiCadObjectType types = 3;  // Filter by type
}

message GetSchematicItemsResponse {
    repeated google.protobuf.Any items = 1;
    int32 total_count = 2;
}

// Create simple schematic items (junction, wire, label)
message CreateSchematicItems {
    kiapi.common.types.DocumentSpecifier schematic = 1;
    repeated google.protobuf.Any items = 2;
}

message CreateSchematicItemsResponse {
    repeated kiapi.common.types.KIID created_ids = 1;
    repeated string errors = 2;  // Any creation errors
}
