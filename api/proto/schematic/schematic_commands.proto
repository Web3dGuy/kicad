syntax = "proto3";

package kiapi.schematic.commands;

import "common/types/base_types.proto";
import "common/types/enums.proto";
import "google/protobuf/any.proto";
import "schematic/schematic_types.proto";

// Proof of Concept: Get basic schematic information
message GetSchematicInfo {
    kiapi.common.types.DocumentSpecifier schematic = 1;
}

message SchematicInfoResponse {
    string project_name = 1;
    int32 sheet_count = 2;
    int32 symbol_count = 3;
    int32 net_count = 4;
    repeated string sheet_names = 5;
}

// Get schematic items (wires, junctions, labels)
message GetSchematicItems {
    kiapi.common.types.DocumentSpecifier schematic = 1;
    repeated kiapi.common.types.KIID item_ids = 2;  // Empty = get all
    repeated kiapi.common.types.KiCadObjectType types = 3;  // Filter by type
}

message GetSchematicItemsResponse {
    repeated google.protobuf.Any items = 1;
    int32 total_count = 2;
}

// Create simple schematic items (junction, wire, label)
message CreateSchematicItems {
    kiapi.common.types.DocumentSpecifier schematic = 1;
    repeated google.protobuf.Any items = 2;
}

message CreateSchematicItemsResponse {
    repeated kiapi.common.types.KIID created_ids = 1;
    repeated string errors = 2;  // Any creation errors
}

// Draw wire between two points
message DrawWire {
    kiapi.common.types.DocumentSpecifier schematic = 1;
    kiapi.common.types.Vector2 start_point = 2;
    kiapi.common.types.Vector2 end_point = 3;
    int32 width = 4;  // Optional wire width in internal units (default: 0 = use default)
}

message DrawWireResponse {
    kiapi.common.types.KIID wire_id = 1;
    string error = 2;  // Any error that occurred
}

// Get pins for a specific symbol
message GetSymbolPins {
    kiapi.common.types.DocumentSpecifier schematic = 1;
    kiapi.common.types.KIID symbol_id = 2;  // Symbol UUID to get pins for
}

message GetSymbolPinsResponse {
    repeated kiapi.schematic.types.Pin pins = 1;  // List of pins with their positions
    string reference = 2;  // Symbol reference (e.g., "D1", "BT1")
    kiapi.common.types.Vector2 symbol_position = 3;  // Symbol origin position
    string error = 4;  // Any error that occurred
}

// Get component bounding box for collision detection
message GetComponentBounds {
    kiapi.common.types.DocumentSpecifier schematic = 1;
    kiapi.common.types.KIID symbol_id = 2;  // Symbol UUID to get bounds for
    bool include_pins = 3;  // Include pin extents in bounding box
    bool include_fields = 4;  // Include field extents in bounding box
}

message GetComponentBoundsResponse {
    kiapi.common.types.Vector2 top_left = 1;  // Bounding box top-left corner
    kiapi.common.types.Vector2 bottom_right = 2;  // Bounding box bottom-right corner
    string reference = 3;  // Symbol reference (e.g., "D1", "BT1")
    string error = 4;  // Any error that occurred
}

// Get grid snap points for smart routing
message GetGridAnchors {
    kiapi.common.types.DocumentSpecifier schematic = 1;
    kiapi.common.types.Vector2 position = 2;  // Position to find anchors near
    int32 snap_range = 3;  // Search radius in nanometers
    repeated kiapi.common.types.KIID skip_items = 4;  // Items to skip in search
}

message GetGridAnchorsResponse {
    repeated GridAnchor anchors = 1;  // Available snap points
    string error = 2;  // Any error that occurred
}

message GridAnchor {
    kiapi.common.types.Vector2 position = 1;  // Anchor position
    string type = 2;  // Anchor type (grid, pin, connection, etc.)
    kiapi.common.types.KIID item_id = 3;  // Item this anchor belongs to (optional)
    int32 distance = 4;  // Distance from requested position
}

// Get connection points for wire routing
message GetConnectionPoints {
    kiapi.common.types.DocumentSpecifier schematic = 1;
    kiapi.common.types.Vector2 region_start = 2;  // Search region start (optional)
    kiapi.common.types.Vector2 region_end = 3;    // Search region end (optional)
}

message GetConnectionPointsResponse {
    repeated kiapi.common.types.Vector2 connections = 1;  // Available connection points
    string error = 2;  // Any error that occurred
}

// Selection Management System - Phase 1 Foundational Optimizations
message GetSelection {
    kiapi.common.types.DocumentSpecifier schematic = 1;
}

message SelectionResponse {
    repeated google.protobuf.Any items = 1;
    int32 selection_count = 2;
}

message AddToSelection {
    kiapi.common.types.DocumentSpecifier schematic = 1;
    repeated kiapi.common.types.KIID item_ids = 2;
}

message RemoveFromSelection {
    kiapi.common.types.DocumentSpecifier schematic = 1;
    repeated kiapi.common.types.KIID item_ids = 2;
}

message ClearSelection {
    kiapi.common.types.DocumentSpecifier schematic = 1;
}
